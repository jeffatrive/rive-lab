# Publishes the whole repo to GitHub Pages: https://jeffatrive.github.io/rive-lab/
# Runs on every push to main, and on demand (Actions tab > "Deploy static content to Pages" > Run workflow,
# or `gh workflow run static.yml`). Settings > Pages > Source must be "GitHub Actions".
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer one waits for the running one to finish
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Smashabout's game file is too big to keep in git history, so it lives on the
      # `smashabout-game` release (smashabout/publish.sh uploads it) and is copied in here.
      - name: Fetch the Smashabout game file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download smashabout-game --repo "$GITHUB_REPOSITORY" --pattern game.riv --dir smashabout --clobber; then
            ls -l smashabout/game.riv
          else
            echo "::warning::No game.riv on the smashabout-game release: the Smashabout page won't load its game. Run smashabout/publish.sh."
          fi
      # the 2.5D planning test copy of the page (smashabout-25d/publish.sh, Jeff 2026-10-26), from its own release
      - name: Fetch the Smashabout 2.5D test game file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download smashabout-25d-game --repo "$GITHUB_REPOSITORY" --pattern game.riv --dir smashabout-25d --clobber; then
            ls -l smashabout-25d/game.riv
          else
            echo "::warning::No game.riv on the smashabout-25d-game release yet. Run smashabout-25d/publish.sh."
          fi
      # Earth Invasion's game file, from its own release (earth-invasion/publish.sh, Jeff 2026-11-05)
      - name: Fetch the Earth Invasion game file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download earth-invasion-game --repo "$GITHUB_REPOSITORY" --pattern game.riv --dir earth-invasion --clobber; then
            ls -l earth-invasion/game.riv
          else
            echo "::warning::No game.riv on the earth-invasion-game release yet. Run earth-invasion/publish.sh."
          fi
      # Snack Storm's game file, from its own release (snack-storm-play/publish.sh, Jeff 2026-11-06)
      - name: Fetch the Snack Storm game file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download snack-storm-game --repo "$GITHUB_REPOSITORY" --pattern game.riv --dir snack-storm-play --clobber; then
            ls -l snack-storm-play/game.riv
          else
            echo "::warning::No game.riv on the snack-storm-game release yet. Run snack-storm-play/publish.sh."
          fi
      # Snack Storm's perf test file, from its own release (snack-storm-perf/publish.sh, 2026-11-14)
      - name: Fetch the Snack Storm perf test file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download snack-storm-perf --repo "$GITHUB_REPOSITORY" --pattern game.riv --dir snack-storm-perf --clobber; then
            ls -l snack-storm-perf/game.riv
          else
            echo "::warning::No game.riv on the snack-storm-perf release yet. Run snack-storm-perf/publish.sh."
          fi
      # Skip Intro's site file, from its own release (skip-intro-site/publish.sh, Jeff 2026-11-08)
      - name: Fetch the Skip Intro site file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download skip-intro-game --repo "$GITHUB_REPOSITORY" --pattern game.riv --dir skip-intro-site --clobber; then
            ls -l skip-intro-site/game.riv
          else
            echo "::warning::No game.riv on the skip-intro-game release yet. Run skip-intro-site/publish.sh."
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
