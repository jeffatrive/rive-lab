# Publishes the whole repo to GitHub Pages: https://jeffatrive.github.io/rive-lab/
# Runs on every push to main, and on demand (Actions tab > "Deploy static content to Pages" > Run workflow,
# or `gh workflow run static.yml`). Settings > Pages > Source must be "GitHub Actions".
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer one waits for the running one to finish
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Smashabout's game file is too big to keep in git history, so it lives on the
      # `smashabout-game` release (smashabout/publish.sh uploads it) and is copied in here.
      - name: Fetch the Smashabout game file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download smashabout-game --repo "$GITHUB_REPOSITORY" --pattern game.riv --dir smashabout --clobber; then
            ls -l smashabout/game.riv
          else
            echo "::warning::No game.riv on the smashabout-game release: the Smashabout page won't load its game. Run smashabout/publish.sh."
          fi
      # the AnimaScript build's copy of the page (smashabout-as/publish.sh, Jeff 2026-10-25), from its own release
      - name: Fetch the Smashabout AnimaScript game file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download smashabout-as-game --repo "$GITHUB_REPOSITORY" --pattern game.riv --dir smashabout-as --clobber; then
            ls -l smashabout-as/game.riv
          else
            echo "::warning::No game.riv on the smashabout-as-game release yet. Run smashabout-as/publish.sh."
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
