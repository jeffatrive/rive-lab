<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Dictation</title>
  <style>
    :root {
      --bg: #0f1012;
      --fg: #f2f2f2;
      --muted: #a3a3a3;
      --accent: #ff5a3c;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
    header, footer { padding: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    h1 { font-size: 18px; margin: 0 auto 0 0; font-weight: 600; }
    button { font: inherit; color: var(--fg); background: #24262b; border: 1px solid #3a3d44;
      border-radius: 999px; padding: 10px 18px; cursor: pointer; }
    button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #111; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    #stage { position: relative; min-height: 0; }
    canvas { width: 100%; height: 100%; display: block; }
    #status { color: var(--muted); }
    #typing { display: none; flex: 1; min-width: 200px; }
    #typing input { width: 100%; font: inherit; padding: 10px 14px; border-radius: 12px;
      border: 1px solid #3a3d44; background: #17181b; color: var(--fg); }
    .no-speech #typing { display: block; }
    .no-speech #mic { display: none; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Live Dictation</h1>
      <button id="mic" type="button" aria-pressed="false">Start listening</button>
      <button id="clear" type="button">Clear</button>
    </header>

    <div id="stage">
      <!-- The animated text is decorative; the transcript below carries the words. -->
      <canvas id="canvas" aria-hidden="true"></canvas>
    </div>

    <footer>
      <p id="status" role="status">Press Start listening and talk.</p>
      <label id="typing">
        <span class="visually-hidden">Type to see the effect</span>
        <input id="typing-input" type="text" autocomplete="off"
               placeholder="Speech isn't available in this browser, so type instead">
      </label>
    </footer>

    <!-- Screen readers get settled words only, so interim guesses don't spam them. -->
    <p id="transcript" class="visually-hidden" aria-live="polite"></p>
  </main>

  <!-- Pin the runtime version; WebGL2 uses the Rive Renderer and supports every editor feature. -->
  <script src="https://unpkg.com/@rive-app/webgl2@2.50.0"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
