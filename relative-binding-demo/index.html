<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rive Relative Binding Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="controls">
    <label for="arcValue">
      <input type="range" id="arcValue" min="0" max="100" value="81" step="1" />
    </label>
    <button type="button" id="arcBtn">Arc</button>
    <button type="button" id="waveBtn">Wave (not relative)</button>
  </div>
  <canvas id="riveCanvas"></canvas>
  <script src="https://unpkg.com/@rive-app/webgl2@latest"></script>
  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const yearSpan = document.querySelector('.copyright-year');
      const currentYear = new Date().getFullYear();
  if (yearSpan) {
    yearSpan.textContent = currentYear;
  }
    });
  </script>
</body>
</html>
